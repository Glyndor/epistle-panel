[test]
# Register a DOM into the global scope before any test runs, so React
# component tests render against happy-dom under `bun test`.
preload = ["./src/test/setup/index.ts"]

# Keep test helpers out of the coverage report so the number describes
# production code. The patterns are globs matched against the file path.
coveragePathIgnorePatterns = [
	"**/test-support/**",
	"src/test/**",
	"**/*.test.ts",
	"**/*.test.tsx",
]
