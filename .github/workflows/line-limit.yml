name: Line limit

# The file-size standard (soft 300, hard 500 code lines). It only asks a question
# when a source file changes, so it is filtered to the extensions it reads and to
# its own file and script; a documentation-only change cannot move the answer.
# The logic is scripts/ci/line-limit/check.sh.

on:
  pull_request:
    # The check reads the tree, and the promotion pull request to main carries a
    # tree it already read on develop. Content that reaches main by any other
    # route is out of this trigger's reach: main takes only develop (main-guard).
    branches: [develop]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mjs"
      - "**.js"
      - "**.py"
      - "**.sh"
      - ".github/workflows/line-limit.yml"

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. A push to a
# branch is never cancelled, so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  line-limit:
    name: line limit
    runs-on: ubuntu-latest
    # Measured 2026-11-15: 6 s of work.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint and test the check
        run: |
          set -euo pipefail
          shellcheck -x scripts/ci/line-limit/*.sh
          bash scripts/ci/line-limit/check.test.sh

      - name: Hard limit of 500 code lines per file
        run: bash scripts/ci/line-limit/check.sh
