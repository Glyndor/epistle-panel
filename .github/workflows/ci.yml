name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  bun:
    uses: Glyndor/.github/.github/workflows/bun-ci.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      working-directory: internal
      # The Bun release the release workflow and the Containerfile use. The
      # reusable defaults to an older one, so without this the gate would test
      # a different runtime from the one that ships.
      bun-version: 1.4.4
      coverage-threshold: 90
  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      max-age-days: 15
