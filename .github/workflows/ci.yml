name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Into develop only: the promotion pull request to main carries a tree this
    # check already answered for on develop, and it is not required on main
    # (the ruleset there requires `develop-only`). The push to main still runs it.
    branches: [develop]

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. A push to a
# branch is never cancelled, so every merge keeps its own result. The reusable
# below has its own group; this one is the caller's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bun:
    uses: Glyndor/.github/.github/workflows/bun-ci.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      working-directory: internal
      # The Bun release the release workflow and the Containerfile use. The
      # reusable defaults to an older one, so without this the gate would test
      # a different runtime from the one that ships.
      bun-version: 1.4.4
      coverage-threshold: 90
  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      max-age-days: 15
