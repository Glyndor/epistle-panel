name: guard

on:
  pull_request:
    branches: ["main"]

# Required on main, so it has no `paths:` filter and no job-level `if:`: a
# skipped required check reports success. A newer push to the same pull request
# supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  develop-only:
    name: develop-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require develop as source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (got $HEAD_REF)."
            exit 1
          fi
          echo "Source branch is develop."
