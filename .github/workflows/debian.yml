name: Debian package

# Builds the epistle-panel .deb, lints it, and installs it in a clean Debian
# container. The package is a podup stack fragment with no application code, so
# the checks are about its footprint: account, directories, modes, secrets and a
# compose fragment that parses. The list below includes this workflow: one whose
# `paths:` does not list itself never runs on the pull request that edits it.

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/debian.yml"
      - "debian/**"
      - "scripts/version/check-changelog.sh"
      - "scripts/debian/**"
      - "internal/package.json"
  pull_request:
    paths:
      - ".github/workflows/debian.yml"
      - "debian/**"
      - "scripts/version/check-changelog.sh"
      - "scripts/debian/**"
      - "internal/package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # debian:trixie, digest-pinned so a retag cannot change the environment.
  DEBIAN_IMAGE: docker.io/library/debian:trixie@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4

jobs:
  debian:
    name: Build, lint and smoke-test the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: debian/changelog matches internal/package.json
        run: sh scripts/version/check-changelog.sh

      - name: dpkg-buildpackage and lintian
        run: BUILD_IMAGE="$DEBIAN_IMAGE" sh scripts/debian/build.sh "$RUNNER_TEMP/deb"

      - name: Install, reinstall, remove and purge in a clean container
        run: SMOKE_IMAGE="$DEBIAN_IMAGE" sh scripts/debian/smoke.sh "$RUNNER_TEMP"/deb/epistle-panel_*_all.deb
