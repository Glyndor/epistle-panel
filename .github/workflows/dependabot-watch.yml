name: Dependabot watch

# Two questions about Dependabot that no change answers, so they are asked on a
# clock and not on a pull request:
#
# - Is a security bump stuck? Dependabot security updates ignore `target-branch`
#   and open against `main`, where `main-guard` refuses any pull request whose
#   source branch is not `develop`. The bump then sits open with one red check
#   and nothing reports it. `target-branch: develop` and `main-guard` stay as they
#   are, the bump is re-landed by hand off `develop`, and the stuck state has to
#   be loud. This job is the loud part: it lists the open pull requests into `main` and fails when
#   Dependabot authored one whose head is not `develop`
#   (scripts/ci/dependabot_security_watch.py).
# - Is Dependabot alive? A silent Dependabot reports nothing, and "everything is
#   up to date" looks the same. It fails when its newest pull request, in any
#   state, is more than 15 days old (scripts/ci/freshness/check.sh).
#
# Both are advisory and required nowhere: a required check that fails because a
# third party opened a pull request, or stayed quiet, would block every
# unrelated merge. The tests of both scripts run in the `ci scripts` job of
# ci.yml, when a script changes.
#
# `schedule` is daily because a stuck bump ages a day at a time. GitHub reads
# `schedule:` from the default branch only; `workflow_dispatch` reruns it by
# hand after a bump is re-landed.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-watch:
    name: dependabot security watch
    runs-on: ubuntu-latest
    # Measured 2026-11-22: 5 s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Dependabot pull requests stuck against main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # `pipefail` makes a failed `gh` call fail the step instead of letting
        # the script read an empty stream.
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --base main --state open --limit 100 \
            --json number,title,author,headRefName,createdAt \
            | python3 scripts/ci/dependabot_security_watch.py

  freshness:
    name: dependabot freshness
    runs-on: ubuntu-latest
    # Measured 2026-11-22: 14 s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The newest Dependabot pull request is under 15 days old
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_AGE_DAYS: "15"
        run: bash scripts/ci/freshness/check.sh
