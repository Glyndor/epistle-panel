name: End-to-end

# Called by ci.yml when the plan says a change can move the answer (see
# scripts/ci/plan/map.toml). Builds the panel and runs scripts/e2e/run.sh and
# scripts/headers/verify.sh against the built standalone server and a stand-in
# API, over 127.0.0.1. Those checks see what the unit tests cannot: the headers
# and cookie a real server emits, the proxy, the actions and the limiter bundled
# separately. It uses no secrets.
#
# `internal/package.json` and `internal/bun.lock` select it because a bump of
# Next, React or the bundler changes the standalone server and the headers these
# scripts read, which no unit test sees. The price is one run, about four
# minutes, on every dependency bump.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # An estimate with a margin: runs on 2026-11-12 finished between about 1 and
    # 8 minutes, and locally the build takes under a minute and the scripts
    # about two, so 15 leaves room for a cold install and a slow runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same Bun as ci.yml, release.yml and the Containerfile;
          # scripts/consistency/check-bun-version.sh keeps them equal.
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: internal
        run: bun install --frozen-lockfile

      - name: Build the panel
        working-directory: internal
        run: bun run build

      - name: Tests of the e2e scripts
        run: bun test scripts/e2e

      - name: End-to-end scenarios
        run: bash scripts/e2e/run.sh

      - name: Security headers
        run: bash scripts/headers/verify.sh
