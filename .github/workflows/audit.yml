name: Dependency audit

# `bun audit` reads internal/bun.lock and asks the advisory database. A new
# advisory appears without any file changing, so this is not filtered by path: it
# runs on every pull request into develop and on every push to develop or main,
# and the weekly run audits both branches, because a schedule only fires from the
# default branch and would otherwise never look at develop. It needs no install
# and no secret, so a run takes seconds.
#
# The weekly run holds the privileges of the default branch, so it does not bring
# the tree of the branch it audits. There is one checkout, the event's. Of each
# audited branch, a fixed list, it takes only `package.json` and `bun.lock` with
# `git show` into a clean folder outside the workspace and runs `bun audit` there:
# no install, no script of that branch, no cache, no second checkout, no `ref:`.
# `bun audit` reads the lockfile and asks the advisory database, and needs
# nothing installed.
#
# Advisory only, on purpose: it is not a required check. A new advisory is a third
# party's disclosure timing and must never block an unrelated merge. The release
# workflow keeps its own `bun audit` as the blocking gate. GitHub reads
# `schedule:` from the default branch only, so the cron starts once this reaches
# main; `workflow_dispatch` covers the gap.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    # Measured 2026-11-15: 7 s.
    timeout-minutes: 10
    steps:
      # Every branch is a remote-tracking ref after this, which is what `git show`
      # below reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun at the release the Containerfile names
        # The script is the event's own, never a branch's that is audited below.
        run: bash scripts/ci/bun/install.sh

      - name: Advisories in the lockfiles
        env:
          EVENT: ${{ github.event_name }}
          BRANCHES: develop main
        # Exits non-zero on any advisory, development dependencies included, and
        # on a failed lookup, the same as the release gate. An advisory judged not
        # to apply is passed as `--ignore=<GHSA id>` with the reason beside it, in
        # a reviewed change. A branch that does not exist, or a file that is empty,
        # fails the step.
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ]; then
            cd internal
            bun audit
            exit 0
          fi
          failed=0
          for branch in $BRANCHES; do
            dir="$(mktemp -d "$RUNNER_TEMP/audited.XXXXXX")"
            for file in package.json bun.lock; do
              git show "origin/${branch}:internal/${file}" >"$dir/$file"
              if [ ! -s "$dir/$file" ]; then
                echo "::error::internal/${file} of ${branch} is empty"
                exit 1
              fi
            done
            echo "== ${branch}"
            (cd "$dir" && bun audit) || failed=1
          done
          exit "$failed"
