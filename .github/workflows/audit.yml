name: Dependency audit

# `bun audit` reads internal/bun.lock and asks the advisory database. A new
# advisory appears without any file changing, so this is not filtered by path: it
# runs on every pull request into develop and on every push to develop or main,
# and the weekly run audits both branches, because a schedule only fires from the
# default branch and would otherwise never look at develop. It needs no install
# and no secret, so a run takes seconds.
#
# Advisory only, on purpose: it is not a required check. A new advisory is a third
# party's disclosure timing and must never block an unrelated merge. The release
# workflow keeps its own `bun audit` as the blocking gate. GitHub reads
# `schedule:` from the default branch only, so the cron starts once this reaches
# main; `workflow_dispatch` covers the gap.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    # Measured 2026-11-15: 7 s.
    timeout-minutes: 10
    strategy:
      # The branches are audited independently: one failing is no reason to skip
      # the other.
      fail-fast: false
      matrix:
        # An empty ref is the one the event names. Only the weekly run, which
        # fires on the default branch, has to name both.
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "develop"]') || fromJSON('[""]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same Bun as the Containerfile and release.yml;
          # scripts/consistency/check-bun-version.sh keeps them equal.
          bun-version: 1.4.4
          # This job checks out another branch than the one the event names, and
          # the weekly run holds the privileges of the default branch. Nothing is
          # restored from a cache or saved to one: the install is clean every time.
          no-cache: true

      - name: Advisories in the lockfile
        working-directory: internal
        # Exits non-zero on any advisory, development dependencies included,
        # and on a failed lookup, the same as the release gate. An advisory
        # judged not to apply is passed as `--ignore=<GHSA id>` with the
        # reason beside it, in a reviewed change.
        run: bun audit
