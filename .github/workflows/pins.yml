name: Action pins

# Every `uses:` of a workflow or an action is fixed to a commit, and nothing runs
# that is not from `actions/` or `github/` (scripts/ci/pins/check.sh). A tag can be
# moved to other code by whoever holds the repository it names, and a commit
# cannot.
#
# It runs on a pull request into develop that touches a workflow, an action or the
# check itself, and every Monday, because a file nobody touched can be changed by a
# merge that this filter did not see. It is advisory: a workflow filtered by path
# leaves a required check pending, so it is not required.

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/**"
      - "**/action.yml"
      - "**/action.yaml"
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    name: action pins
    runs-on: ubuntu-latest
    # An estimate: the check reads about 20 small files, so it is a matter of seconds.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Lint and test the check
        run: |
          set -euo pipefail
          shellcheck -x scripts/ci/pins/*.sh
          bash scripts/ci/pins/check.test.sh

      # On a pull request the rule is the base commit's copy of the script, so a
      # change cannot loosen the check that reads it.
      - name: Every reference is fixed to a commit or a digest
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/pins-check.sh"
          if [ "$EVENT" = pull_request ] && git cat-file -e HEAD^1:scripts/ci/pins/check.sh 2>/dev/null; then
            git show HEAD^1:scripts/ci/pins/check.sh >"$script"
          else
            cp scripts/ci/pins/check.sh "$script"
          fi
          bash "$script"
