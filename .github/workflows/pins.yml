name: Action pins

# The weekly look at the pins. The check that stands in the way of a merge is the
# `action pins` job of ci.yml, which runs whenever anything under .github/ changes;
# this one covers what does not change: a tag that is moved, or an image whose tag
# the registry points somewhere else, with no file touched. It runs
# scripts/ci/pins/check.py with --remote, which asks each repository which commit
# the tag of the version comment names and the registry which digest the tag of an
# image has, and fails when the pin is not that one or when it cannot ask.

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pins:
    name: action pins (weekly)
    runs-on: ubuntu-latest
    # An estimate: about a dozen questions to GitHub and two to the registry.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The YAML reader of the check
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pins-venv"
          "$RUNNER_TEMP/pins-venv/bin/pip" install --quiet --only-binary=:all: --require-hashes -r scripts/ci/plan/requirements.txt

      - name: Every reference is fixed to the commit or the digest of its release
        run: '"$RUNNER_TEMP/pins-venv/bin/python" -I scripts/ci/pins/check.py --remote'
