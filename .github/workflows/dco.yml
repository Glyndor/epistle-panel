name: DCO

# The organisation's sign-off gate: every commit on a pull request carries a
# Signed-off-by trailer, and no merge commit on it carries a change of its own.
# The logic is scripts/ci/dco/check.sh, tested in the `ci scripts` job of
# ci.yml. It also runs on the promotion pull request to main, where the squash
# commits of develop are the ones it reads.
#
# The script that judges a pull request is the base commit's copy, so the pull
# request cannot rewrite the rule that reads it; the change that introduces the
# script is the one exception. This workflow file is still the pull request's
# own, which is the residual risk of every check: a job that reports a required
# name can be replaced by one that does nothing, so every change under .github/ is
# read before it merges.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. A push to a
# branch is never cancelled, so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dco:
    # The name is what the ruleset of develop requires. It was the check of the
    # shared workflow this job replaces, and it stays so no ruleset has to change.
    name: dco / Signed-off-by present on every commit
    runs-on: ubuntu-latest
    # Measured 2026-11-15: 5 s of work. The rest of a run is the wait for a runner.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Signed-off-by on every commit, no evil merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/dco-check.sh"
          if git cat-file -e "${BASE_SHA}:scripts/ci/dco/check.sh" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/ci/dco/check.sh" >"$script"
          else
            cp scripts/ci/dco/check.sh "$script"
          fi
          bash "$script"
