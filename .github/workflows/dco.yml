name: DCO

# The organisation's sign-off gate: every commit on a pull request carries a
# Signed-off-by trailer. The logic is the shared reusable; the pull_request
# trigger has to live in the repository.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. A push to a
# branch is never cancelled, so every merge keeps its own result. The reusable
# below has its own group; this one is the caller's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    uses: Glyndor/.github/.github/workflows/dco.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
