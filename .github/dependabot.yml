version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    target-branch: "develop"

  # The Next.js project lives in internal/ (package.json + bun.lock). Without
  # this entry the whole front-end dependency tree, Next.js, React and the auth
  # surface, goes unwatched.
  - package-ecosystem: "bun"
    directory: "/internal"
    schedule:
      interval: "daily"
    labels: ["type:deps"]
    open-pull-requests-limit: 10
    target-branch: "develop"
