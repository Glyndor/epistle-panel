version: 2

# One group per ecosystem for minor and patch updates, so each ecosystem opens
# one pull request a week; a major is never grouped and arrives as a pull
# request of its own, where its changelog gets read alone. A dependency that
# matches no group also gets its own pull request.
#
# Weekly everywhere. The freshness check of `dependabot-watch.yml` fails after
# 15 days without a Dependabot pull request, so a weekly run tolerates one missed
# run and a daily one would make the check unable to tell a dead Dependabot from
# a busy one.
#
# Dependabot reads this file from the default branch, `main`, so a change here
# takes effect when the next release pull request reaches it.
#
# `target-branch: develop` stays. Dependabot SECURITY updates ignore it and open
# against main, where main-guard refuses them; `dependabot-watch.yml` reports
# those instead of letting them sit.
#
# Labels must exist in the repository (`gh label list`), or Dependabot drops
# them. `cooldown` delays a new release for a few days before a version update;
# security updates are not delayed. Docker and github-actions accept only
# `default-days`.
#
# Not covered, because Dependabot reads no file where they are written: the
# digest-pinned Debian image of ci-debian.yml and release.yml, and the pinned
# actionlint release of ci.yml.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    labels: ["type:deps", "type:ci", "area:meta"]
    open-pull-requests-limit: 10
    target-branch: "develop"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Next.js project lives in internal/ (package.json + bun.lock). Dependabot
  # resolves a group together, so the packages that must move together (react and
  # react-dom, next and next-intl) do.
  - package-ecosystem: "bun"
    directory: "/internal"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: ["type:deps", "area:frontend"]
    open-pull-requests-limit: 10
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Containerfile pins every base by digest, so a moved tag never changes
  # the image silently; this is what moves the digests on purpose. The Bun
  # release is the tag of the `FROM docker.io/oven/bun:<version>-debian@sha256:`
  # stage, which this reads and moves. scripts/ci/bun/install.sh installs that
  # release in every job after checking scripts/ci/bun/SHA256SUMS, and
  # scripts/consistency/check-bun-version.sh fails a bump that has no hash line, so
  # the pull request for a new Bun needs that one line added by hand.
  #
  # The Node and distroless bases are pinned by digest alone, and a digest has no
  # semver level. Dependabot's documentation does not say which group takes
  # such an update, so the second group catches whatever the first does not,
  # majors of the Bun tag included.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    cooldown:
      default-days: 3
    labels: ["type:deps", "area:meta"]
    open-pull-requests-limit: 10
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-digests:
        patterns: ["*"]

  # The signing script's dependencies are hash-pinned in
  # scripts/release/sign/sign-requirements.txt, which nothing else updates. Both
  # packages are one set: the hashes of cryptography and cffi move together, so
  # they arrive in one pull request. A bump that the signing tests (the
  # `release-scripts` job of ci.yml) reject is not merged.
  - package-ecosystem: "pip"
    directory: "/scripts/release/sign"
    schedule:
      interval: "weekly"
      day: "thursday"
    cooldown:
      default-days: 3
    labels: ["type:deps", "area:meta"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      signing:
        patterns: ["*"]

  # The YAML reader of the wiring tests is hash-pinned in
  # scripts/ci/plan/requirements.txt. A bump needs the hashes of its wheels, which
  # Dependabot writes, and the `ci scripts` job installs them with
  # `--require-hashes`.
  - package-ecosystem: "pip"
    directory: "/scripts/ci/plan"
    schedule:
      interval: "weekly"
      day: "thursday"
    cooldown:
      default-days: 3
    labels: ["type:deps", "area:meta"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      yaml-reader:
        patterns: ["*"]
