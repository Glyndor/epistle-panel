name: guard
true:
  pull_request:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  develop-only:
    name: develop-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require develop of this repository as source branch
      env:
        HEAD_REF: ${{ github.head_ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPO: ${{ github.repository }}
      run: |
        if [ "$HEAD_REF" != "develop" ]; then
          echo "::error::Pull requests into main must come from develop (got $HEAD_REF)."
          exit 1
        fi
        if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$REPO" ]; then
          echo "::error::The develop of a pull request into main must be the one of $REPO (got '$HEAD_REPO')."
          exit 1
        fi
        echo "Source branch is develop of $REPO."
