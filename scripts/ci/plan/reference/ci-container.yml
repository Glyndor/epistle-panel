name: Container
true:
  workflow_call: null
permissions:
  contents: read
jobs:
  build:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Every pinned base is an amd64 and arm64 index
      run: bash scripts/consistency/check-base-indexes.sh
    - name: Read the package version
      id: version
      run: |
        set -euo pipefail
        package_version=$(grep -m1 '"version":' internal/package.json | cut -d'"' -f4)
        if [ -z "$package_version" ]; then
          echo "::error::could not parse version from internal/package.json"
          exit 1
        fi
        echo "package=${package_version}" >> "$GITHUB_OUTPUT"
        echo "Package version: ${package_version}"
    - name: Build the image
      env:
        PACKAGE_VERSION: ${{ steps.version.outputs.package }}
      run: |
        set -euo pipefail
        # `podman` ships on the runner; no build action. The platform is
        # explicit so the bases resolve the same index entry every run.
        podman build \
          --platform linux/amd64 \
          --build-arg "VERSION=${PACKAGE_VERSION}" \
          --build-arg "REVISION=${GITHUB_SHA}" \
          -t epistle-panel:ci .
    - name: Version label matches package.json
      env:
        PACKAGE_VERSION: ${{ steps.version.outputs.package }}
      run: |
        set -euo pipefail
        label=$(podman image inspect \
          --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
          localhost/epistle-panel:ci)
        echo "Label: ${label}"
        if [ "$label" != "$PACKAGE_VERSION" ]; then
          echo "::error::image version label is '${label}', package.json says '${PACKAGE_VERSION}'"
          exit 1
        fi
    - name: Runtime user is 65532
      run: |
        set -euo pipefail
        # The image reference is qualified: the base declares
        # `io.containers.autoupdate=registry`, which makes podman reject a
        # bare short name.
        user=$(podman image inspect \
          --format '{{.Config.User}}' localhost/epistle-panel:ci)
        echo "User: ${user}"
        if [ "$user" != "65532:65532" ]; then
          echo "::error::image User is '${user}', expected 65532:65532"
          exit 1
        fi
    - name: The server answers, and the admin area is the 404 of a missing path
      run: |
        set -euo pipefail
        # Run the way an operator can: root file system read-only with a
        # writable /tmp, no capability, no privilege gain. The server has to
        # answer without writing anywhere else in the image.
        admin_id=$(cat /proc/sys/kernel/random/uuid)
        podman run -d --name panel \
          --read-only --tmpfs /tmp \
          --cap-drop=ALL --security-opt no-new-privileges \
          -p 127.0.0.1:17587:7587 \
          -e EPISTLE_API_URL=http://127.0.0.1:1 \
          -e EPISTLE_API_TOKEN=ci-token \
          -e EPISTLE_PANEL_SESSION_SECRET=ci-session-secret-at-least-32-bytes-long \
          -e EPISTLE_PANEL_ADMIN_ID="${admin_id}" \
          localhost/epistle-panel:ci
        trap 'podman logs panel || true; podman rm -f panel >/dev/null' EXIT

        for _ in $(seq 1 30); do
          if curl -s -o /dev/null http://127.0.0.1:17587/; then
            break
          fi
          sleep 1
        done

        signin=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17587/)
        if [ "$signin" != "200" ]; then
          echo "::error::/ answered ${signin}, expected 200"
          exit 1
        fi

        # Without a session the mail area sends the browser to the sign-in
        # page, and the admin area, with the right id or another, is the 404
        # of a missing path, never a redirect; anything else means the gate
        # is open or that it confirms the admin area exists.
        result=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:17587/app/mail)
        if [ "$result" != "307 http://127.0.0.1:17587/" ]; then
          echo "::error::/app/mail answered '${result}', expected a 307 to /"
          exit 1
        fi
        for path in /app /app/queue "/app/${admin_id}" "/app/${admin_id}/queue" "/app/$(cat /proc/sys/kernel/random/uuid)/accounts" /login; do
          result=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:17587${path}")
          if [ "$result" != "404 " ]; then
            echo "::error::${path} answered '${result}', expected a bare 404"
            exit 1
          fi
        done
