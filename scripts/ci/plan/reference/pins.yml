name: Action pins
true:
  schedule:
  - cron: 29 6 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pins:
    name: action pins (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: The YAML reader of the check
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/pins-venv"
        "$RUNNER_TEMP/pins-venv/bin/pip" install --quiet --only-binary=:all: --require-hashes -r scripts/ci/plan/requirements.txt
    - name: Every reference is fixed to the commit or the digest of its release
      run: '"$RUNNER_TEMP/pins-venv/bin/python" -I scripts/ci/pins/check.py --remote'
