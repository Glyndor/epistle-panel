name: Action pins
true:
  schedule:
  - cron: 29 6 * * 1
  workflow_dispatch: null
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pins:
    name: action pins (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: The YAML reader of the check
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/pins-venv"
        "$RUNNER_TEMP/pins-venv/bin/pip" install --quiet --only-binary=:all: --require-hashes -r scripts/ci/plan/requirements.txt
    - name: Every reference is the commit or the digest of its release
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/drift"
        "$RUNNER_TEMP/pins-venv/bin/python" -I scripts/ci/pins/check.py --remote --weekly --report "$RUNNER_TEMP/drift/drift.json"
    - name: Hand the report to the job that writes the issue
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pins-drift
        path: ${{ runner.temp }}/drift/drift.json
        retention-days: 1
        if-no-files-found: ignore
  report:
    name: issue for the images that moved
    needs: pins
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Receive the report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: pins-drift
        path: ${{ runner.temp }}/drift
    - name: Open the issue, or update the one that is open
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        file="$RUNNER_TEMP/drift/drift.json"
        [ -f "$file" ] || { echo "no report: the check did not get as far as writing one"; exit 0; }
        total="$(jq 'if type == "array" then length else error("not a list") end' "$file")"
        [ "$total" -gt 0 ] || { echo "no image has moved"; exit 0; }
        # Only entries of the exact shape are written; anything else fails the job.
        rows="$(jq -r '.[]
          | select((.repository | test("^[a-z0-9./-]+$")) and (.tag | test("^[A-Za-z0-9._-]+$"))
              and (.pinned | test("^sha256:[0-9a-f]{64}$")) and (.current | test("^sha256:[0-9a-f]{64}$")))
          | "- `\(.repository):\(.tag)`: pinned `\(.pinned)`, the registry gives `\(.current)` now"' "$file")"
        [ "$(printf '%s\n' "$rows" | grep -c .)" -eq "$total" ] || { echo "::error::an entry of the report is not of the shape expected"; exit 1; }
        title="Pinned images have moved"
        body="$(printf 'The registry gives another digest for the tag of these images, and I pin them by digest in the workflows (ci-debian.yml and release.yml hold the same one):\n\n%s\n\nI change the digest in every workflow that names the image, in one pull request. Until then nothing is blocked: the pull requests ask about the pins they change.\n\nThis issue is updated each Monday while the digests differ.' "$rows")"
        number="$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
        if [ -n "$number" ]; then
          gh issue edit "$number" --repo "$REPO" --body "$body"
          echo "updated the issue #$number"
        else
          gh issue create --repo "$REPO" --title "$title" --body "$body" --label type:deps --label prio:P3 --label effort:XS --label area:meta
        fi
