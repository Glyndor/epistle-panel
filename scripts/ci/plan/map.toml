# What each suite of .github/workflows/ci.yml looks at.
#
# The `plan` job reads this file and prints, for each suite below, whether the
# change in front of it can move the suite's answer. A suite whose answer cannot
# move is skipped, and the `ci gate` job accepts that only when this file said
# so. `scripts/ci/plan/test_plan.py` holds the map to two promises:
#   - every tracked file is read by at least one suite, or is listed under
#     [ignore] with the reason it needs none;
#   - a suite runs for a file of its own and does not run for a file of another.
#
# Patterns: `*` is anything but `/`, `**` is anything, `**/` may match nothing.
# A suite that stays out of a file on purpose says so in `exclude`.
#
# A job in ci.yml has the name of its suite here. Adding a suite means adding
# the job, listing it in the `needs` of `gate`, and writing its cases in the
# test; the test fails until all three agree.

# Suites, and jobs of `always`, that the map knows and the workflow may not have a
# job for yet. The gate runs the base commit's copy of this file, so a job that a
# pull request adds to the gate has to be taught to the base first: one pull request
# adds it here as optional, the next adds the job to ci.yml, and a third takes the
# word off this list so that the job is required. See docs/maintainers/ci.md.
optional = ["commit-checks"]

# What judges the whole tree, or every commit of a pull request, runs on every change,
# whatever it touches, because a change of prose alone can push a folder or a file past
# its limit, or add a credential. Those jobs
# are not suites: the plan does not decide them and `ci gate` requires each one to
# succeed.
always = ["line-limit", "commit-checks"]

# A change to what decides what runs, or to anything that runs, runs every suite:
# a workflow or an action is what a suite executes, and a change to the workflow
# that `e2e` calls has to run `e2e`, not only the checks that read its text.
# `.github/actions/` does not exist yet; the pattern is here for the day it does.
machinery = [
	"scripts/ci/plan/**",
	"scripts/ci/bun/**",
	".github/workflows/**",
	".github/actions/**",
]

# Paths that no suite needs, each group with the reason.
[ignore]
paths = [
	# Prose. Nothing builds, runs or lints it.
	"**/*.md",
	"docs/**",
	"LICENSE",
	# Editor, git and tool settings that no job reads.
	".editorconfig",
	".gitignore",
	"internal/.gitignore",
	# Read by the folder limit, which has a workflow of its own.
	"scripts/folder-limit/**",
]

# Biome reads every file of the project, its own settings and the shadcn ones
# included.
# The Containerfile is also an input of every job that runs Bun, but only through one
# line: its stage names the release that scripts/ci/bun/install.sh installs. That is
# the [[line_rules]] entry at the end of this file, so a new digest of the Node base
# does not run what a new Bun does.
[suites.lint]
push = true
include = ["internal/**"]
exclude = ["internal/.gitignore"]

# The build and the tests read the project; the settings of Biome and of the
# shadcn command line are not among their inputs.
[suites.unit]
push = true
include = ["internal/**", "scripts/test/**"]
exclude = ["internal/.gitignore", "internal/biome.json", "internal/components.json"]

[suites.randomized]
include = ["internal/**", "scripts/test/**"]
exclude = ["internal/.gitignore", "internal/biome.json", "internal/components.json"]

[suites.e2e]
include = [
	"internal/src/**",
	"internal/next.config.ts",
	"internal/postcss.config.mjs",
	"internal/tsconfig.json",
	"internal/package.json",
	"internal/bun.lock",
	"scripts/e2e/**",
	"scripts/headers/**",
]
exclude = [
	"internal/**/*.test.ts",
	"internal/**/*.test.tsx",
	"internal/src/test/**",
	"internal/src/**/test-support/**",
]

[suites.container]
include = [
	"Containerfile",
	".containerignore",
	"scripts/consistency/check-base-indexes.sh",
	"internal/src/**",
	"internal/next.config.ts",
	"internal/postcss.config.mjs",
	"internal/tsconfig.json",
	"internal/package.json",
	"internal/bun.lock",
]
exclude = [
	"internal/**/*.test.ts",
	"internal/**/*.test.tsx",
	"internal/src/test/**",
	"internal/src/**/test-support/**",
]

[suites.debian]
include = [
	"debian/**",
	"scripts/debian/**",
	"scripts/release/version/check-changelog.sh",
	"internal/package.json",
]

[suites.release-scripts]
include = ["scripts/release/**"]

[suites.bun-version]
include = [
	".github/workflows/**",
	"Containerfile",
	"scripts/consistency/**",
	"scripts/release/lib/assertions.sh",
]

[suites.actionlint]
include = [".github/workflows/**"]

# Every pin of an action and of an image is the one its release says. It asks the
# repositories and the registry, so it runs whenever anything under .github/ changes
# (a workflow is also machinery and runs everything), and whenever an action file
# changes anywhere, or the check itself.
[suites.action-pins]
include = [".github/**", "**/action.yml", "**/action.yaml", "scripts/ci/pins/**"]

# The tests of the scripts the other jobs run, and of the wiring of the CI: the
# map against ci.yml, the workflows it calls and the gate. A change to any
# workflow, to a script of the CI or to the map itself can break that wiring.
[suites.ci-scripts]
include = ["scripts/ci/**", ".github/**"]

# A change to a file selects these suites only when one of its changed lines matches
# the pattern (a line added or removed). The release of Bun is the tag of this stage;
# the installer reads it, so lint, unit, randomized and e2e run when it moves. When
# the lines cannot be read, the suites run.
[[line_rules]]
path = "Containerfile"
pattern = '^FROM docker\.io/oven/bun:'
suites = ["lint", "unit", "randomized", "e2e"]
